{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card pequeno">
    <h1>Entrar</h1>
    <p>Acesse sua agenda de beleza.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>.</p>
</div>
{% endblock %}
