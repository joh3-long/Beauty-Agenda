{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class="card pequeno">
    <h1>Criar conta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Cadastrar</button>
    </form>
    <p>Já possui conta? <a href="{% url 'login' %}">Entrar</a>.</p>
</div>
{% endblock %}
