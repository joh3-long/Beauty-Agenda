{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card pequeno">
    <h1>{{ titulo }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Salvar</button>
        <a class="botao secundario" href="{% url 'lista_servicos' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
